lm_evaluation:
  model:
    block_size: 512
    n_layer: 6
    n_head: 6
    n_embd: 384
    dropout: 0.1
    bias: false

  training:
    batch_size: 16
    learning_rate: 6.0e-4
    min_lr: 6.0e-5
    weight_decay: 0.1
    beta1: 0.9
    beta2: 0.95
    max_steps: 2000
    eval_interval: 200
    eval_steps: 40
    warmup_steps: 100
    device: "auto"
    seed: 42

  dataset:
    train_split_ratio: 0.90
    max_tokens_eval: 2000000
